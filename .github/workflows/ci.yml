name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.0 torchvision==0.22.0
          python -m pip install '.[dev,medical]'
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -t maea-inference:ci .
      - name: Check CLI
        run: docker run --rm maea-inference:ci --help
      - name: Run CPU inference
        run: |
          docker run --rm --network none \
            --entrypoint python \
            --mount type=bind,src="$PWD/tests/docker_smoke.py",dst=/tmp/docker_smoke.py,readonly \
            maea-inference:ci /tmp/docker_smoke.py
