[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maea-inference"
version = "0.1.0"
description = "Standalone inference runtime for MAEA imaging models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "efficientnet-pytorch==0.7.1",
  "numpy==2.2.5",
  "opencv-python-headless>=4.12.0,<5",
  "Pillow==11.2.1",
  "segmentation-models-pytorch>=0.5.0,<0.6",
  "timm==1.0.15",
  "torch==2.7.0",
  "torchvision==0.22.0",
]

[project.optional-dependencies]
medical = [
  "nibabel==5.3.2",
  "pydicom>=2.5,<4",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
maea-infer = "maea_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP031"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
